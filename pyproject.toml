[project]
name = "carlos-cms"
version = "1.0.0"
description = "Content and operations CLI for carlos.nz (posts, labs, site text, LinkedIn, GitHub sync, images)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.27.2",
  "supabase>=2.31.0",
  "python-frontmatter>=1.3.0",
  "pyyaml>=6.0.3",
  "pillow>=12.3.0",
  "httpx>=0.28.1",
  "cryptography>=50.0.2",
  "python-dotenv>=1.2.4",
]

[project.scripts]
cms = "carlos_cms.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["carlos_cms"]

[tool.uv]
package = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = ["S603", "RUF001"]

[tool.ruff.lint.isort]
known-third-party = ["supabase"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
